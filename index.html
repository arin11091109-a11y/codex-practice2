<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>社内AI勉強会のお知らせ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-gradient: linear-gradient(135deg, #2d4df4 0%, #6ac6ff 100%);
        --surface: #ffffff;
        --accent: #ffb347;
        --text-main: #1c1c28;
        --text-sub: #5a6275;
        --border-radius: 18px;
        font-size: 16px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'Noto Sans JP', 'Roboto', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: radial-gradient(circle at 10% 20%, rgba(106, 198, 255, 0.25), transparent 55%),
          radial-gradient(circle at 80% 0%, rgba(255, 179, 71, 0.28), transparent 60%), #f5f7fb;
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
      }

      .card {
        width: min(960px, 100%);
        background-color: rgba(255, 255, 255, 0.9);
        box-shadow: 0 24px 60px rgba(32, 59, 126, 0.15);
        border-radius: var(--border-radius);
        overflow: hidden;
        backdrop-filter: blur(12px);
      }

      .hero {
        position: relative;
        height: clamp(240px, 45vw, 420px);
        background-image: url('https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?auto=format&fit=crop&w=1600&q=80');
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: flex-end;
        padding: 32px;
        color: #ffffff;
      }

      .hero::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0.6) 100%);
      }

      .hero-content {
        position: relative;
        max-width: 480px;
      }

      .hero-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.2);
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 0.85rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }

      .hero-title {
        font-size: clamp(1.8rem, 4vw, 3rem);
        line-height: 1.2;
        font-weight: 700;
        margin: 0 0 12px;
      }

      .hero-description {
        margin: 0;
        font-size: 1rem;
        line-height: 1.7;
        opacity: 0.92;
      }

      .details {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 24px;
        padding: 36px clamp(24px, 6vw, 48px) 40px;
        background: var(--surface);
      }

      .detail-item {
        background: rgba(109, 167, 255, 0.08);
        border-radius: 16px;
        padding: 20px 24px;
        border: 1px solid rgba(45, 77, 244, 0.12);
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .detail-item:hover {
        transform: translateY(-4px);
        box-shadow: 0 18px 36px rgba(45, 77, 244, 0.12);
      }

      .detail-label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-sub);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .detail-value {
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1.5;
        color: var(--text-main);
      }

      .detail-value span {
        display: block;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text-sub);
        margin-top: 4px;
      }

      @media (max-width: 600px) {
        body {
          padding: 32px 16px;
        }

        .hero {
          padding: 24px;
        }

        .detail-item {
          padding: 18px 20px;
        }

        .detail-value {
          font-size: 1.1rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <section class="hero" aria-labelledby="event-title">
        <div class="hero-content">
          <span class="hero-badge">AI Learning Session</span>
          <h1 class="hero-title" id="event-title">社内AI勉強会 2024 Spring</h1>
          <p class="hero-description">
            最新の生成AI活用事例や社内でのAI推進ロードマップを共有し、
            実践に繋がるアイデアを一緒に探りましょう。
          </p>
        </div>
      </section>
      <section class="details" aria-label="イベント詳細">
        <article class="detail-item">
          <h2 class="detail-label">開催日時</h2>
          <p class="detail-value">2024年5月24日 (金)<span>14:00 - 17:30</span></p>
        </article>
        <article class="detail-item">
          <h2 class="detail-label">場所</h2>
          <p class="detail-value">本社 イノベーションラボ<span>東京都千代田区XX-XX</span></p>
        </article>
        <article class="detail-item">
          <h2 class="detail-label">タイトル</h2>
          <p class="detail-value">Generative AI実践勉強会<span>~アイデア創出とプロトタイピング~</span></p>
        </article>
      </section>
    </main>
  </body>
</html>
